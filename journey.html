<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Journey | Ikhlas Institution</title>
  <meta name="theme-color" content="#070a09">
  <script>
    (function () {
      var theme = 'dark';
      try { if (localStorage.getItem('ikhlas-theme') === 'light') theme = 'light'; } catch (e) {}
      document.documentElement.setAttribute('data-theme', theme);
      document.documentElement.style.colorScheme = theme;
    })();
  </script>
  <link rel="icon" href="assets/logo/ikhlas-logo.png" type="image/png">
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@400;500;600;700&family=Noto+Sans+Ethiopic:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/refinement.css">
  <script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
</head>
<body data-root="">
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <div class="site-header__inner">
      <a class="brand" href="index.html" aria-label="Ikhlas Institution, home">
        <img class="brand__logo" src="assets/logo/ikhlas-logo.png" alt="Ikhlas Institution logo" width="60" height="60">
      </a>
      <nav class="desktop-nav" aria-label="Primary navigation"><ul class="desktop-nav__list">
        <li><a class="nav-link" href="index.html#home"><i data-lucide="home" aria-hidden="true"></i><span>Home</span></a></li>
        <li><a class="nav-link" href="index.html#about"><i data-lucide="book-open" aria-hidden="true"></i><span>About</span></a></li>
        <li><a class="nav-link" href="sectors.html"><i data-lucide="layers" aria-hidden="true"></i><span>Sectors</span></a></li>
        <li><a class="nav-link is-active" href="journey.html"><i data-lucide="history" aria-hidden="true"></i><span>Journey</span></a></li>
        <li><a class="nav-link" href="announcements.html"><i data-lucide="megaphone" aria-hidden="true"></i><span>Announcements</span></a></li>
        <li><a class="nav-link" href="index.html#contact"><i data-lucide="mail" aria-hidden="true"></i><span>Contact</span></a></li>
      </ul></nav>
      <div class="header-controls">
        <button type="button" class="control-btn theme-btn" data-theme-toggle aria-label="Switch between dark and light theme">
          <i data-lucide="moon-star" class="icon-dark" aria-hidden="true"></i>
          <i data-lucide="sun" class="icon-light" aria-hidden="true"></i>
        </button>
      </div>
    </div>
  </header>

  <main id="main">
    <section class="section">
      <div class="container">
        <header class="section-head">
          <p class="eyebrow">Journey</p>
          <h1 class="section-title">Our journey</h1>
          <p class="lead">Stories, updates and reflections from Ikhlas Institution.</p>
        </header>
        <div id="journey-grid" class="card-grid"></div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-bottom">
      <p>&copy; <span id="year"></span> Ikhlas Institution. All rights reserved.</p>
    </div>
  </footer>

  <nav class="dock" aria-label="Mobile navigation"><ul class="dock__list">
    <li><a class="dock__link" href="index.html#home" aria-label="Home"><i data-lucide="home" aria-hidden="true"></i></a></li>
    <li><a class="dock__link" href="index.html#about" aria-label="About"><i data-lucide="book-open" aria-hidden="true"></i></a></li>
    <li><a class="dock__link" href="sectors.html" aria-label="Sectors"><i data-lucide="layers" aria-hidden="true"></i></a></li>
    <li><a class="dock__link is-active" href="journey.html" aria-label="Journey"><i data-lucide="history" aria-hidden="true"></i></a></li>
    <li><a class="dock__link" href="announcements.html" aria-label="Announcements"><i data-lucide="megaphone" aria-hidden="true"></i></a></li>
    <li><a class="dock__link" href="index.html#contact" aria-label="Contact"><i data-lucide="mail" aria-hidden="true"></i></a></li>
  </ul></nav>

  <script src="https://cdn.jsdelivr.net/npm/lucide@0.383.0/dist/umd/lucide.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/text.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/features.js"></script>
  <script>
    (function () {
      var D = window.Ikhlas.data;
      var T = window.Ikhlas.text;
      document.getElementById('journey-grid').innerHTML = D.journey.map(function (p) {
        var media = p.video
          ? '<figure class="media media--video"><video controls playsinline preload="metadata"' +
            (p.image ? ' poster="' + T.esc(p.image) + '"' : '') + '><source src="' + T.esc(p.video) +
            '" type="video/mp4">Your browser cannot play this video.</video></figure>'
          : (p.image
            ? '<figure class="media"><img src="' + T.esc(p.image) + '" alt="' + T.esc(p.title) + '"></figure>'
            : '<figure class="media is-missing"><span class="media__label">Image to be added</span></figure>');
        var body = p.body && p.body.length
          ? '<div class="post-card__text">' + p.body.map(function (t) { return '<p>' + T.fmt(t) + '</p>'; }).join('') + '</div>'
          : '';
        return '<article class="card post-card">' + media +
          '<div class="post-card__body">' +
          '<p class="post-card__meta"><span class="tag">' + T.esc(p.category) + '</span>' +
          '<span>' + (p.date ? T.esc(p.date) : 'Date to be announced') + '</span></p>' +
          '<h3 class="card-title card-title--sm">' + T.esc(p.title) + '</h3>' +
          '<p class="card-text">' + T.fmt(p.description) + '</p>' + body +
          '</div></article>';
      }).join('');
      window.Ikhlas.theme.init();
      if (window.lucide && window.lucide.createIcons) window.lucide.createIcons();
      var y = document.getElementById('year');
      if (y) y.textContent = String(new Date().getFullYear());
    })();
  </script>
</body>
</html>
